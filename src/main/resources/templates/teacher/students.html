<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ученики')}"></head>
<body>
<nav th:replace="~{fragments :: nav(${user}, 'students')}"></nav>
<main class="page container narrow">
    <div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
    <header class="page-header"><div><p class="eyebrow">Ваш класс</p><h1>Ученики</h1><p>Управляйте запросами и открывайте расписание каждого ученика.</p></div></header>
    <section class="panel section-panel">
        <div class="panel-heading"><div><p class="eyebrow">Требуют внимания</p><h2>Новые запросы <span class="count" th:text="${pending.size()}">0</span></h2></div></div>
        <div th:if="${pending.empty}" class="empty compact"><span>✓</span><p>Новых запросов нет</p></div>
        <div th:each="request : ${pending}" class="person-row">
            <span class="avatar" th:text="${#strings.substring(request.student.displayName,0,1)}">А</span>
            <div><b th:text="${request.student.displayName}">Ученик</b><small th:text="${'@' + request.student.username}">@login</small></div>
            <div class="row-actions"><form th:action="@{/teacher/requests/{id}/reject(id=${request.id})}" method="post"><button class="button ghost" type="submit">Отклонить</button></form><form th:action="@{/teacher/requests/{id}/accept(id=${request.id})}" method="post"><button class="button primary" type="submit">Принять</button></form></div>
        </div>
    </section>
    <section class="panel section-panel">
        <div class="panel-heading"><div><p class="eyebrow">Активные</p><h2>Мои ученики <span class="count" th:text="${students.size()}">0</span></h2></div></div>
        <div th:if="${students.empty}" class="empty"><span>◎</span><h3>Пока никого нет</h3><p>Передайте ученику свой код подключения.</p></div>
        <div th:each="student : ${students}" class="person-row">
            <span class="avatar cyan" th:text="${#strings.substring(student.displayName,0,1)}">А</span><div><b th:text="${student.displayName}">Ученик</b><small th:text="${'@' + student.username}">@login</small></div><a class="button secondary" th:href="@{/teacher}">Назначить занятие</a>
        </div>
    </section>
</main>
</body>
</html>
