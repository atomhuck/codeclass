<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Восстановление пароля')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><span class="brand-mark">&gt;_</span><span>CodeClass</span></a>
        <div><p class="eyebrow">Доступ к аккаунту</p><h1>Забыли пароль?</h1><p class="lead">Введите логин или подтверждённый email.</p></div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/forgot-password}" method="post" class="stack-form">
            <label>Логин или email<input name="identifier" required autofocus autocomplete="username"></label>
            <button class="button primary full">Отправить ссылку <span>→</span></button>
        </form>
        <p class="auth-switch"><a th:href="@{/login}">← Вернуться ко входу</a></p>
    </section>
</main></body></html>
