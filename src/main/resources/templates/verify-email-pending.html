<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Подтверждение email')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><span class="brand-mark">&gt;_</span><span>CodeClass</span></a>
        <div><p class="eyebrow">Почти готово</p><h1>Подтвердите email</h1><p class="lead">Мы отправили ссылку на <b th:text="${user.email}">email</b>. Она действует 24 часа.</p></div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <form th:action="@{/verify-email/resend}" method="post"><button class="button secondary full">Отправить письмо ещё раз</button></form>
        <form th:action="@{/logout}" method="post"><button class="button ghost full">Выйти</button></form>
    </section>
</main></body></html>
