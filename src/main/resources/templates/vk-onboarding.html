<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Выбор роли')}"></head>
<body class="auth-page">
<main class="auth-shell compact-auth">
    <section class="auth-card role-card">
        <div class="vk-welcome">
            <span class="vk-logo large" aria-hidden="true">
                <svg viewBox="0 0 48 48"><path d="M24.7 36.7C10 36.7 1.6 26.6 1.3 9.8h7.4c.2 12.3 5.7 17.5 10.1 18.6V9.8h7v10.6c4.3-.5 8.8-5.3 10.3-10.6h7c-1.2 6.5-6.1 11.3-9.6 13.3 3.5 1.6 9.1 5.8 11.2 13.6H37c-1.6-5.1-5.7-9-11.2-9.6v9.6h-1.1z"/></svg>
            </span>
            <div>
                <p class="eyebrow">Регистрация через VK</p>
                <h1 th:text="'Привет, ' + ${vkName} + '!'">Привет!</h1>
                <p>Кем вы будете пользоваться RepetHelper?</p>
            </div>
        </div>
        <div th:if="${registrationError}" class="alert error" th:text="${registrationError}"></div>
        <form th:action="@{/auth/vk/onboarding}" th:object="${form}" method="post" class="stack-form">
            <fieldset class="choice-fieldset role-choice">
                <legend>Выберите один вариант</legend>
                <label class="choice-card">
                    <input type="radio" th:field="*{role}" value="STUDENT">
                    <span><b>Ученик</b><small>Расписание, домашние задания и доски</small></span>
                </label>
                <label class="choice-card">
                    <input type="radio" th:field="*{role}" value="TEACHER">
                    <span><b>Преподаватель</b><small>Ученики, занятия и учебные материалы</small></span>
                </label>
            </fieldset>
            <small class="field-error" th:errors="*{role}"></small>
            <p class="legal-note">Продолжая, вы принимаете
                <a th:href="@{/legal/terms}" target="_blank">пользовательское соглашение</a>
                и даёте <a th:href="@{/legal/personal-data}" target="_blank">согласие на обработку персональных данных</a>.
            </p>
            <button class="button primary full" type="submit">Продолжить<svg class="ui-icon" aria-hidden="true"><use th:href="@{/brand/ui-icons.svg#arrow-right}"></use></svg></button>
        </form>
        <a class="auth-back" th:href="@{/login}">Отмена и возврат ко входу</a>
    </section>
</main>
</body>
</html>
