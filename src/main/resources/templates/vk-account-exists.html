<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Подтвердите аккаунт')}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-copy"><a class="brand large" href="/login"><span class="brand-mark">&gt;_</span><span>CodeClass</span></a><p class="eyebrow">Защита аккаунта</p><h1>Подтвердите существующий аккаунт.</h1><p class="lead">Мы не объединяем аккаунты автоматически. Войдите с паролем, чтобы явно привязать VK.</p></section><section class="auth-card"><h2>Вход для привязки VK</h2><div th:if="${error}" class="alert error" th:text="${error}"></div><form th:action="@{/auth/vk/account-exists}" method="post" class="stack-form"><label>Логин или email<input name="identifier" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><a class="form-link" th:href="@{/forgot-password}">Забыли пароль?</a><button class="button primary full" type="submit">Подтвердить и привязать VK</button></form></section></main></body></html>
