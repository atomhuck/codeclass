<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Новый пароль')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><span class="brand-mark">&gt;_</span><span>CodeClass</span></a>
        <div><p class="eyebrow">Безопасность</p><h1>Новый пароль</h1></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <form th:action="@{/reset-password}" method="post" class="stack-form">
            <input type="hidden" name="token" th:value="${token}">
            <label>Новый пароль<input type="password" name="password" required minlength="10" maxlength="72" autocomplete="new-password"></label>
            <label>Повторите пароль<input type="password" name="passwordConfirmation" required minlength="10" maxlength="72" autocomplete="new-password"></label>
            <button class="button primary full">Сохранить пароль <span>→</span></button>
        </form>
    </section>
</main></body></html>
